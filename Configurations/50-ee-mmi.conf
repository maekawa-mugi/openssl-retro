# Experimental PS2 Emotion Engine (R5900) target.
# Configure with no-shared no-threads no-dso no-tests and a PS2SDK toolchain.
# Do not inherit linux-mips32: R5900 is not MIPS32 and its MMI is not MIPS SIMD.
my %targets = (
    "ps2-ee-mmi" => {
        inherit_from   => [ "BASE_unix" ],
        CC             => "mips64r5900el-ps2-elf-gcc",
        CXX            => "mips64r5900el-ps2-elf-g++",
        AR             => "mips64r5900el-ps2-elf-ar",
        RANLIB         => "mips64r5900el-ps2-elf-ranlib",
        OBJCOPY        => "mips64r5900el-ps2-elf-objcopy",
        CFLAGS         => picker(default => "-O2 -Wall",
                                 debug => "-O0 -g",
                                 release => "-O3 -fomit-frame-pointer"),
        cflags         => add("-march=r5900"),
        lib_cppflags   => add("-DL_ENDIAN"),
        bn_ops         => "BN_LLONG",
        thread_scheme  => "(unknown)",
        asm_arch       => "ee_mmi",
        perlasm_scheme => "void",
    },
);
